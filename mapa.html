<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mapa Scout | Red Scout Bajío</title>
    <meta name="description" content="Mapa interactivo con zonas de camping y hiking para la comunidad scout del Bajío.">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1B4332">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Mapa Scout | Red Scout Bajío">
    <meta property="og:description" content="Encuentra zonas de camping y hiking scout en el Bajío.">
    <meta property="og:url" content="https://scoutsbajio-coder.github.io/red-scout-bajio/mapa.html">
    <meta property="og:image" content="https://scoutsbajio-coder.github.io/red-scout-bajio/og-image.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { height: 100%; }
        body { margin: 0; background: #F5F5F0; font-family: Arial, sans-serif; }

        /* "dvh" evita que la barra del navegador móvil tape parte del mapa */
        #map { height: calc(100vh - 72px); height: calc(100dvh - 72px); width: 100%; }

        .scout-green { background-color: #1B4332; }

        /* Controles del mapa */
        .leaflet-bottom.leaflet-right { right: 12px !important; bottom: 70px !important; }
        .leaflet-top, .leaflet-bottom { z-index: 900 !important; }
        .leaflet-control-zoom { margin-top: 10px !important; margin-right: 10px !important; }
        .leaflet-control-layers {
            margin-top: 10px !important; margin-right: 10px !important;
            border-radius: 10px !important; box-shadow: 0 3px 12px rgba(0,0,0,.25) !important;
        }

        /* Marcadores */
        .custom-marker {
            background-color: #1B4332; width: 38px; height: 38px;
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
            display: flex; align-items: center; justify-content: center;
            border: 3px solid white; box-shadow: 0 3px 8px rgba(0,0,0,.35);
        }
        .custom-marker i { color: white; font-size: 16px; transform: rotate(45deg); }

        /* Popup */
        .popup-title { font-weight: 800; font-size: 16px; color: #1B4332; margin-bottom: 4px; }
        .popup-municipio { font-size: 11px; font-weight: bold; color: #2563eb; text-transform: uppercase; margin-bottom: 7px; }
        .popup-link {
            display: block; margin-top: 8px; background: #1D4ED8; color: white !important;
            padding: 8px 10px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold;
        }
        .popup-link.secundario { background: #1B4332; }

        /* Buscador */
        .search-container {
            position: absolute; top: 88px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: min(92%, 420px);
        }
        .search-box { position: relative; background: white; border-radius: 14px; box-shadow: 0 5px 18px rgba(0,0,0,.20); overflow: hidden; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; pointer-events: none; }
        #buscador { width: 100%; border: none; outline: none; padding: 14px 45px 14px 42px; font-size: 16px; box-sizing: border-box; }
        #clear-search {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            width: 30px; height: 30px; border-radius: 50%; border: none; background: #e5e7eb; color: #4b5563;
            cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5;
        }
        #clear-search:hover { background: #d1d5db; }

        /* Contador */
        .map-info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(27,67,50,.95); color: white; padding: 9px 16px; border-radius: 999px;
            font-size: 12px; font-weight: bold; box-shadow: 0 4px 12px rgba(0,0,0,.25); white-space: nowrap;
        }

        /* Aviso sin conexión */
        .aviso-offline {
            position: absolute; top: 140px; left: 50%; transform: translateX(-50%); z-index: 1000;
            width: min(92%, 420px); background: #fef3c7; color: #78350f; border-radius: 10px;
            padding: 8px 12px; font-size: 12px; font-weight: bold; text-align: center; display: none;
        }

        /* Celular */
        @media (max-width: 640px) {
            #map { height: calc(100vh - 64px); height: calc(100dvh - 64px); }
            .search-container { top: 76px; width: 92%; }
            .aviso-offline { top: 128px; }
            .leaflet-control-zoom {
                position: fixed !important; right: 12px !important; bottom: 78px !important;
                left: auto !important; top: auto !important; margin: 0 !important; z-index: 950 !important;
            }
            .leaflet-control-zoom a { width: 46px !important; height: 46px !important; line-height: 46px !important; font-size: 24px !important; }
            .leaflet-control-layers {
                position: fixed !important; right: 12px !important; bottom: 178px !important;
                left: auto !important; top: auto !important; margin: 0 !important; z-index: 950 !important;
            }
            .map-info { bottom: calc(15px + env(safe-area-inset-bottom)); font-size: 11px; padding: 8px 13px; }
        }
    </style>
</head>
<body>

    <nav class="scout-green text-white h-[72px] flex items-center shadow-lg relative z-[1100]" style="padding-top: env(safe-area-inset-top)">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="favicon-64.png" alt="Red Scout Bajío" width="40" height="40" class="w-10 h-10 object-contain rounded-full bg-white p-0.5">
                <div>
                    <h1 class="font-bold text-lg leading-tight">Mapa Scout</h1>
                    <p class="text-xs text-green-200">Red Scout Bajío</p>
                </div>
            </div>
            <a href="index.html" class="bg-yellow-500 text-green-900 px-4 py-2 rounded-full font-bold text-sm hover:bg-yellow-400 transition">
                <i class="fas fa-home mr-1"></i> Inicio
            </a>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <label for="buscador" class="sr-only">Buscar lugar o municipio</label>
            <input type="text" id="buscador" placeholder="Buscar lugar o municipio..." autocomplete="off">
            <button id="clear-search" type="button" aria-label="Limpiar búsqueda">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <div id="aviso-offline" class="aviso-offline" role="status">
        Sin conexión: los lugares se ven, pero el mapa base necesita internet.
    </div>

    <div id="map"></div>

    <div class="map-info" id="map-info" aria-live="polite">
        <i class="fas fa-map-marker-alt mr-1"></i> Cargando lugares…
    </div>

    <script src="js/pwa.js"></script>
    <script src="js/mapa.js"></script>
</body>
</html>
