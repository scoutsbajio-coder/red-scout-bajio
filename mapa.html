<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa Scout | Red Scout Bajío</title>

    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon-64.png">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <style>

        /* =====================================================
           GENERAL
        ===================================================== */

        body {
            margin: 0;
            background: #F5F5F0;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           MAPA
        ===================================================== */

        #map {
            height: calc(100vh - 72px);
            width: 100%;
        }


        /* =====================================================
           COLOR SCOUT
        ===================================================== */

        .scout-green {
            background-color: #1B4332;
        }


        /* =====================================================
           CONTROLES DEL MAPA
        ===================================================== */

        /*
         * Movemos TODO el grupo de controles
         * a la esquina inferior derecha.
         */

        .leaflet-bottom.leaflet-right {

            right: 12px !important;
            bottom: 70px !important;

        }


       /* =====================================================
   CONTROLES DE LEAFLET
===================================================== */

/* Contenedor general de controles */
.leaflet-top,
.leaflet-bottom {
    z-index: 900 !important;
}


/* =====================================================
   COMPUTADORA
   ===================================================== */

/* Zoom arriba a la derecha */
.leaflet-control-zoom {
    margin-top: 10px !important;
    margin-right: 10px !important;
}


/* Capas arriba a la derecha */
.leaflet-control-layers {
    margin-top: 10px !important;
    margin-right: 10px !important;

    border-radius: 10px !important;

    box-shadow:
        0 3px 12px rgba(0,0,0,.25) !important;
}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 640px) {

    /* -----------------------------
       ZOOM
    ----------------------------- */

    .leaflet-control-zoom {

        position: fixed !important;

        right: 12px !important;
        bottom: 78px !important;

        left: auto !important;
        top: auto !important;

        margin: 0 !important;

        z-index: 950 !important;
    }


    .leaflet-control-zoom a {

        width: 46px !important;
        height: 46px !important;

        line-height: 46px !important;

        font-size: 24px !important;
    }


    /* -----------------------------
       CAPAS
    ----------------------------- */

    .leaflet-control-layers {

        position: fixed !important;

        right: 12px !important;
        bottom: 178px !important;

        left: auto !important;
        top: auto !important;

        margin: 0 !important;

        z-index: 950 !important;

        border-radius: 10px !important;

        box-shadow:
            0 3px 12px rgba(0,0,0,.25) !important;
    }

            }

        /* =====================================================
           MARCADORES
        ===================================================== */

        .custom-marker {

            background-color: #1B4332;

            width: 38px;
            height: 38px;

            border-radius: 50% 50% 50% 0;

            transform: rotate(-45deg);

            display: flex;

            align-items: center;
            justify-content: center;

            border: 3px solid white;

            box-shadow:
                0 3px 8px rgba(0,0,0,.35);

        }


        .custom-marker i {

            color: white;

            font-size: 16px;

            transform: rotate(45deg);

        }


        /* =====================================================
           POPUP
        ===================================================== */

        .popup-title {

            font-weight: 800;

            font-size: 16px;

            color: #1B4332;

            margin-bottom: 4px;

        }


        .popup-municipio {

            font-size: 11px;

            font-weight: bold;

            color: #2563eb;

            text-transform: uppercase;

            margin-bottom: 7px;

        }


        .popup-link {

            display: block;

            margin-top: 10px;

            background: #1D4ED8;

            color: white !important;

            padding: 8px 10px;

            border-radius: 8px;

            text-align: center;

            text-decoration: none;

            font-weight: bold;

        }


        /* =====================================================
           BUSCADOR
        ===================================================== */

        .search-container {

            position: absolute;

            top: 88px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 1000;

            width: min(92%, 420px);

        }


        .search-box {

            position: relative;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 5px 18px rgba(0,0,0,.20);

            overflow: hidden;

        }


        .search-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            color: #9ca3af;

            pointer-events: none;

        }


        #buscador {

            width: 100%;

            border: none;

            outline: none;

            padding: 14px 45px 14px 42px;

            font-size: 14px;

            box-sizing: border-box;

        }


        /* =====================================================
           BOTÓN X
        ===================================================== */

        #clear-search {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            width: 30px;
            height: 30px;

            border-radius: 50%;

            border: none;

            background: #e5e7eb;

            color: #4b5563;

            cursor: pointer;

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 5;

        }


        #clear-search:hover {

            background: #d1d5db;

        }


        /* =====================================================
           INFORMACIÓN
        ===================================================== */

        .map-info {

            position: absolute;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 1000;

            background: rgba(27,67,50,.95);

            color: white;

            padding: 9px 16px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: bold;

            box-shadow:
                0 4px 12px rgba(0,0,0,.25);

            white-space: nowrap;

        }


        /* =====================================================
           CELULAR
        ===================================================== */

        @media (max-width: 640px) {

            #map {

                height: calc(100vh - 64px);

            }


            .search-container {

                top: 76px;

                width: 92%;

            }


            /* Controles abajo a la derecha */

            .leaflet-bottom.leaflet-right {

                right: 12px !important;

                bottom: 75px !important;

            }


            /* Zoom más grande para celular */

            .leaflet-control-zoom a {

                width: 46px !important;

                height: 46px !important;

                line-height: 46px !important;

                font-size: 24px !important;

            }


            .map-info {

                bottom: 15px;

                font-size: 11px;

                padding: 8px 13px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BARRA SUPERIOR
    ===================================================== -->

    <nav
        class="scout-green text-white h-[72px] flex items-center shadow-lg relative z-[1100]"
    >

        <div
            class="container mx-auto px-4 flex items-center justify-between"
        >

            <div class="flex items-center gap-3">

                <img
                    src="favicon-64.png"
                    alt="Red Scout Bajío"
                    class="w-10 h-10 object-contain rounded-full bg-white p-0.5"
                >

                <div>

                    <h1 class="font-bold text-lg leading-tight">
                        Mapa Scout
                    </h1>

                    <p class="text-xs text-green-200">
                        Red Scout Bajío
                    </p>

                </div>

            </div>


            <a
                href="index.html"
                class="bg-yellow-500 text-green-900 px-4 py-2 rounded-full font-bold text-sm hover:bg-yellow-400 transition"
            >

                <i class="fas fa-home mr-1"></i>

                Inicio

            </a>

        </div>

    </nav>


    <!-- =====================================================
         BUSCADOR
    ===================================================== -->

    <div class="search-container">

        <div class="search-box">

            <i class="fas fa-search search-icon"></i>


            <input
                type="text"
                id="buscador"
                placeholder="Buscar lugar o municipio..."
                autocomplete="off"
            >


            <button
                id="clear-search"
                type="button"
                aria-label="Limpiar búsqueda"
            >

                <i class="fas fa-times"></i>

            </button>

        </div>

    </div>


    <!-- =====================================================
         MAPA
    ===================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         INFORMACIÓN
    ===================================================== -->

    <div
        class="map-info"
        id="map-info"
    >

        <i class="fas fa-map-marker-alt mr-1"></i>

        24 lugares scout

    </div>


<script>


    /* =====================================================
       CREAR MAPA
    ===================================================== */

    const mapa = L.map('map', {

        zoomControl: true

    });


    /* =====================================================
       CAPAS
    ===================================================== */


    /* MAPA NORMAL */

    const mapaNormal = L.tileLayer(

        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

        {

            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',

            maxZoom: 19

        }

    );


    /* SATÉLITE */

    const mapaSatelital = L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

        {

            attribution:
                'Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community',

            maxZoom: 19

        }

    );


    /* TOPOGRÁFICO */

    const mapaTopografico = L.tileLayer(

        'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',

        {

            attribution:
                '&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap',

            maxZoom: 17

        }

    );


    /* MAPA INICIAL */

    mapaNormal.addTo(mapa);


    /* =====================================================
       CONTROL DE CAPAS
    ===================================================== */

    const mapasBase = {

        "🗺️ Mapa": mapaNormal,

        "🛰️ Satélite": mapaSatelital,

        "🏔️ Topográfico": mapaTopografico

    };


    L.control.layers(

        mapasBase,

        null,

        {

            position: 'bottomright',

            collapsed: true

        }

    ).addTo(mapa);


    /* =====================================================
       VISTA GENERAL
    ===================================================== */

    mapa.setView(

        [21.05, -101.05],

        8

    );


    /* =====================================================
       ICONO SCOUT
    ===================================================== */

    const scoutIcon = L.divIcon({

        className: '',

        html: `

            <div class="custom-marker">

                <i class="fas fa-campground"></i>

            </div>

        `,

        iconSize: [38, 38],

        iconAnchor: [19, 38],

        popupAnchor: [0, -38]

    });


    /* =====================================================
       LUGARES
    ===================================================== */

    const lugares = [

        {
            nombre: "Presa Peralillo",
            municipio: "Guanajuato",
            lat: 21.058444,
            lng: -101.169528
        },

        {
            nombre: "Ex Hacienda Cañada de Ortega",
            municipio: "Salamanca",
            lat: 20.7522190,
            lng: -101.1749340
        },

        {
            nombre: "El Piloncillo",
            municipio: "Irapuato",
            lat: 20.6798708,
            lng: -101.4241984
        },

        {
            nombre: "Sierra de Lobos",
            municipio: "León",
            lat: 21.2904809,
            lng: -101.6552010
        },

        {
            nombre: "Parque Metropolitano",
            municipio: "León",
            lat: 21.1738549,
            lng: -101.6880051
        },

        {
            nombre: "Peña Alta",
            municipio: "San Diego de la Unión",
            lat: 21.4609613,
            lng: -100.9886818
        },

        {
            nombre: "Vergel de la Sierra",
            municipio: "San Felipe",
            lat: 21.3847405,
            lng: -101.6340377
        },

         {
            nombre: "Cerro de Arandas",
            municipio: "Irapuato",
            lat: 20.706167,
            lng: -101.393590
        },

        {
            nombre: "Campo Alegre",
            municipio: "San Joaquín",
            lat: 20.9130691,
            lng: -99.5744012
        },

        {
            nombre: "Cerro del Veinte",
            municipio: "Irapuato",
            lat: 20.6794496,
            lng: -101.4971843
        },

        {
            nombre: "Cráter El Rincón de Parangueo",
            municipio: "Valle de Santiago",
            lat: 20.4312160,
            lng: -101.2497244
        },

        {
            nombre: "Cañón de la Garita",
            municipio: "Pénjamo",
            lat: 20.5488428,
            lng: -101.6641022
        },

        {
            nombre: "Cerro de La Bufa",
            municipio: "Guanajuato",
            lat: 20.9944345,
            lng: -101.2530902
        },

        {
            nombre: "Cerro del Muerto",
            municipio: "Aguascalientes",
            lat: 21.8700446,
            lng: -102.4258425
        },

        {
            nombre: "Cerro del Cubilete",
            municipio: "Silao",
            lat: 21.0120474,
            lng: -101.3691937
        },

        {
            nombre: "Sierra Fría",
            municipio: "Aguascalientes",
            lat: 22.1670082,
            lng: -102.5830887
        },

        {
            nombre: "P. N. El Cimatario",
            municipio: "Querétaro",
            lat: 20.5269562,
            lng: -100.3601507
        },

        {
            nombre: "Bosque El Peral",
            municipio: "San José Iturbide",
            lat: 20.9612718,
            lng: -100.2879392
        },

        {
            nombre: "Parque La Beata",
            municipio: "Amealco",
            lat: 20.3130433,
            lng: -100.2381558
        },

        {
            nombre: "Área Protegida Las Musas",
            municipio: "Manuel Doblado",
            lat: 20.6359841,
            lng: -101.8912324
        },

        {
            nombre: "Boca de Túnel",
            municipio: "San José de Gracia",
            lat: 22.2353936,
            lng: -102.4437842
        },

        {
            nombre: "Peña de Bernal",
            municipio: "Bernal",
            lat: 20.7480920,
            lng: -99.9486163
        },

        {
            nombre: "Mirador de Cuatro Palos",
            municipio: "Pinal de Amoles",
            lat: 21.0838869,
            lng: -99.6565660
        },

        {
            nombre: "Parque Ecologico Las Mariposas",
            municipio: "San Felipe",
            lat: 21.392151,
            lng: -101.271680
        },

        {
            nombre: "Cerro El Quijay",
            municipio: "San José Iturbide",
            lat: 21.2508486,
            lng: -100.5078710
        },

        {
            nombre: "Reserva Sierra Gorda",
            municipio: "Querétaro",
            lat: 21.3034190,
            lng: -99.4561101
        }

    ];


    /* =====================================================
       CREAR MARCADORES
    ===================================================== */

    const marcadores = [];


    lugares.forEach((lugar) => {


        const marcador = L.marker(

            [lugar.lat, lugar.lng],

            {
                icon: scoutIcon
            }

        );


        marcador.bindPopup(`

            <div>

                <div class="popup-title">
                    ${lugar.nombre}
                </div>

                <div class="popup-municipio">
                    ${lugar.municipio}
                </div>

                <a
                    href="https://www.google.com/maps/search/?api=1&query=${lugar.lat},${lugar.lng}"
                    target="_blank"
                    class="popup-link"
                >

                    <i class="fas fa-location-arrow mr-1"></i>

                    Ver en Google Maps

                </a>

            </div>

        `);


        marcador.addTo(mapa);


        marcadores.push({

            marcador: marcador,

            datos: lugar

        });

    });


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const buscador =
        document.getElementById('buscador');

    const clearSearch =
        document.getElementById('clear-search');

    const mapInfo =
        document.getElementById('map-info');


    /* =====================================================
       BUSCADOR
    ===================================================== */

    buscador.addEventListener(

        'input',

        function() {


            const texto =
                buscador.value
                    .toLowerCase()
                    .trim();


            /* Mostrar X */

            if (texto.length > 0) {

                clearSearch.style.display = 'flex';

            } else {

                clearSearch.style.display = 'none';

            }


            /* Si está vacío */

            if (texto === '') {

                mostrarTodos();

                mapa.setView(
                    [21.05, -101.05],
                    8
                );

                return;

            }


            /* Buscar */

            const encontrados = [];


            marcadores.forEach((item) => {


                const nombre =
                    item.datos.nombre.toLowerCase();


                const municipio =
                    item.datos.municipio.toLowerCase();


                if (

                    nombre.includes(texto) ||

                    municipio.includes(texto)

                ) {

                    item.marcador.addTo(mapa);

                    encontrados.push(item);

                } else {

                    mapa.removeLayer(
                        item.marcador
                    );

                }

            });


            /* Actualizar contador */

            mapInfo.innerHTML = `

                <i class="fas fa-map-marker-alt mr-1"></i>

                ${encontrados.length}

                lugar${encontrados.length === 1 ? '' : 'es'}

            `;


            /* Un solo resultado */

            if (encontrados.length === 1) {


                mapa.setView(

                    [
                        encontrados[0].datos.lat,
                        encontrados[0].datos.lng
                    ],

                    12

                );


                encontrados[0].marcador.openPopup();

            }


            /* Varios resultados */

            else if (encontrados.length > 1) {


                const grupo =
                    L.featureGroup(

                        encontrados.map(
                            item => item.marcador
                        )

                    );


                mapa.fitBounds(

                    grupo.getBounds(),

                    {

                        padding: [50, 50],

                        maxZoom: 10

                    }

                );

            }

        }

    );


    /* =====================================================
       BOTÓN X
    ===================================================== */

    clearSearch.addEventListener(

        'click',

        function() {


            /* Limpiar */

            buscador.value = '';


            /* Ocultar X */

            clearSearch.style.display = 'none';


            /* Mostrar todos */

            mostrarTodos();


            /* Centrar mapa */

            mapa.setView(

                [21.05, -101.05],

                8

            );


            /* Quitar foco */

            buscador.blur();

        }

    );


    /* =====================================================
       MOSTRAR TODOS
    ===================================================== */

    function mostrarTodos() {


        marcadores.forEach((item) => {

            item.marcador.addTo(mapa);

        });


        mapInfo.innerHTML = `

            <i class="fas fa-map-marker-alt mr-1"></i>

            ${lugares.length} lugares scout

        `;

    }


</script>

</body>

</html>
