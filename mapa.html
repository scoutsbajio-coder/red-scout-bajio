<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa Scout | Red Scout Bajío</title>

    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            background: #F5F5F0;
        }

        #map {
            height: calc(100vh - 72px);
            width: 100%;
        }

        .scout-green {
            background-color: #1B4332;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
        }

        .leaflet-popup-content {
            margin: 14px;
        }
    </style>
</head>

<body>

    <!-- Barra superior -->
    <nav class="scout-green text-white h-[72px] px-4 shadow-lg flex items-center justify-between">

        <div class="flex items-center gap-3">
            <img src="favicon-64.png"
                 alt="Logo Red Scout Bajío"
                 class="w-10 h-10 object-contain rounded-full bg-white p-0.5">

            <div>
                <h1 class="font-bold text-lg leading-tight">
                    Mapa Scout
                </h1>

                <p class="text-xs text-green-200">
                    Red Scout Bajío
                </p>
            </div>
        </div>

        <a href="index.html"
           class="bg-yellow-500 text-green-900 px-4 py-2 rounded-full font-bold text-sm hover:bg-yellow-400 transition">

            <i class="fas fa-arrow-left mr-1"></i>
            Volver
        </a>

    </nav>

    <!-- Mapa -->
    <div id="map"></div>


    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // ==========================================
        // MAPA PRINCIPAL
        // ==========================================

        const map = L.map('map').setView([21.05, -101.25], 8);


        // ==========================================
        // MAPA OPENSTREETMAP
        // ==========================================

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);


        // ==========================================
        // MARCADOR DE EJEMPLO
        // ==========================================

        L.marker([20.6767, -101.3569])
            .addTo(map)
            .bindPopup(`
                <div class="text-center">

                    <h3 class="font-bold text-lg text-gray-800">
                        El Piloncillo
                    </h3>

                    <p class="text-sm text-gray-600 mt-1">
                        Irapuato, Guanajuato
                    </p>

                    <p class="text-xs text-gray-500 mt-2">
                        Rápel · Semidesierto
                    </p>

                </div>
            `);

    </script>

</body>
</html>
