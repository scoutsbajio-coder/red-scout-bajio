<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa Scout | Red Scout Bajío</title>

    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        body {
            margin: 0;
            background: #F5F5F0;
        }

        #map {
            height: calc(100vh - 72px);
            width: 100%;
        }

        .scout-green {
            background-color: #1B4332;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 14px;
        }

        .leaflet-popup-content {
            margin: 16px;
            min-width: 230px;
        }

        .popup-title {
            font-size: 18px;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .popup-location {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .popup-description {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .popup-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .popup-tag {
            background: #dcfce7;
            color: #166534;
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
        }

        .popup-button {
            display: block;
            background: #1D4ED8;
            color: white !important;
            text-align: center;
            padding: 10px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 12px;
        }

        .popup-button:hover {
            background: #1e40af;
        }

        /* Buscador */

        .map-controls {
            position: absolute;
            top: 88px;
            left: 15px;
            z-index: 1000;
            width: min(360px, calc(100% - 30px));
        }

        .search-box {
            background: white;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,.18);
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        #mapSearch {
            width: 100%;
            padding: 11px 40px 11px 38px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        #mapSearch:focus {
            border-color: #1B4332;
            box-shadow: 0 0 0 2px rgba(27,67,50,.15);
        }

        #clearSearch {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #9ca3af;
            cursor: pointer;
            display: none;
        }

        .results {
            margin-top: 8px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.15);
            max-height: 260px;
            overflow-y: auto;
        }

        .result-item {
            padding: 11px 13px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: #f0fdf4;
        }

        .result-name {
            font-size: 13px;
            font-weight: 700;
            color: #1f2937;
        }

        .result-location {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }

        .no-results {
            padding: 14px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        /* Botón mostrar todos */

        .show-all {
            margin-top: 8px;
            width: 100%;
            border: none;
            background: #1B4332;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .show-all:hover {
            background: #143d2d;
        }

        @media (max-width: 640px) {

            .map-controls {
                top: 84px;
                left: 10px;
                width: calc(100% - 20px);
            }

            .leaflet-popup-content {
                min-width: 200px;
            }

        }

    </style>
</head>

<body>

    <!-- ==========================================
         BARRA SUPERIOR
    =========================================== -->

    <nav class="scout-green text-white h-[72px] px-4 shadow-lg flex items-center justify-between">

        <div class="flex items-center gap-3">

            <img src="favicon-64.png"
                 alt="Logo Red Scout Bajío"
                 class="w-10 h-10 object-contain rounded-full bg-white p-0.5">

            <div>
                <h1 class="font-bold text-lg leading-tight">
                    Mapa Scout
                </h1>

                <p class="text-xs text-green-200">
                    Red Scout Bajío
                </p>
            </div>

        </div>

        <a href="index.html"
           class="bg-yellow-500 text-green-900 px-4 py-2 rounded-full font-bold text-sm hover:bg-yellow-400 transition">

            <i class="fas fa-arrow-left mr-1"></i>
            Volver

        </a>

    </nav>


    <!-- ==========================================
         CONTROLES DEL MAPA
    =========================================== -->

    <div class="map-controls">

        <div class="search-box">

            <div class="search-wrapper">

                <i class="fas fa-search"></i>

                <input
                    type="text"
                    id="mapSearch"
                    placeholder="Buscar un lugar..."
                    autocomplete="off">

                <button id="clearSearch">
                    <i class="fas fa-times"></i>
                </button>

            </div>

        </div>

        <div id="results" class="results hidden"></div>

        <button id="showAll" class="show-all">

            <i class="fas fa-map-marked-alt mr-1"></i>
            Mostrar todos los lugares

        </button>

    </div>


    <!-- ==========================================
         MAPA
    =========================================== -->

    <div id="map"></div>


    <!-- ==========================================
         LEAFLET
    =========================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        // =====================================================
        // CREAR MAPA
        // =====================================================

        const map = L.map('map');


        // =====================================================
        // OPENSTREETMAP
        // =====================================================

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // =====================================================
        // LUGARES
        // =====================================================

        const lugares = [

            {
                nombre: "Presa Peralillo",
                ubicacion: "Guanajuato",
                lat: 21.058444,
                lng: -101.169528,
                descripcion: "Clima frío y bosque de encino. Ideal para técnicas de acecho y fogatas de consejo en zonas permitidas.",
                actividades: ["FRÍO", "BOSQUE"]
            },

            {
                nombre: "Ex Hacienda Cañada de Ortega",
                ubicacion: "Salamanca, Guanajuato",
                lat: 20.7522190,
                lng: -101.1749340,
                descripcion: "Área natural protegida con vestigios históricos. Perfecta para caminatas de Clan y campamentos base.",
                actividades: ["HISTORIA", "CAÑÓN"]
            },

            {
                nombre: "El Piloncillo",
                ubicacion: "Irapuato, Guanajuato",
                lat: 20.6798708,
                lng: -101.4241984,
                descripcion: "Zona de terreno técnico para escalada básica y caminatas cortas para la Tropa.",
                actividades: ["RÁPEL", "SEMIDESIERTO"]
            },

            {
                nombre: "Sierra de Lobos",
                ubicacion: "León, Guanajuato",
                lat: 21.2904809,
                lng: -101.6552010,
                descripcion: "Extensa zona boscosa perfecta para grandes juegos y campamentos de varios días.",
                actividades: ["AMPLIO", "PINOS"]
            },

            {
                nombre: "Parque Metropolitano",
                ubicacion: "León, Guanajuato",
                lat: 21.1738549,
                lng: -101.6880051,
                descripcion: "Excelente para actividades de día, rallys y técnica scout básica en un entorno seguro.",
                actividades: ["PRESA", "PISTA"]
            },

            {
                nombre: "Peña Alta",
                ubicacion: "San Diego de la Unión, Guanajuato",
                lat: 21.4609613,
                lng: -100.9886818,
                descripcion: "Área Natural Protegida con bosque de pino y encino. Ideal para caminatas largas y observación.",
                actividades: ["NATURALEZA", "ALTURA"]
            },

            {
                nombre: "Vergel de la Sierra",
                ubicacion: "San Felipe, Guanajuato",
                lat: 21.3847405,
                lng: -101.6340377,
                descripcion: "Zona boscosa de gran altura, perfecta para juegos de acecho y grandes campamentos base.",
                actividades: ["PINOS", "PANORAMA"]
            },

            {
                nombre: "Campo Alegre",
                ubicacion: "San Joaquín, Querétaro",
                lat: 20.9130691,
                lng: -99.5744012,
                descripcion: "Parque nacional seguro y amplio en la Sierra Gorda. Ideal para dinámicas de gran grupo.",
                actividades: ["SEGURO", "AMPLIO"]
            },

            {
                nombre: "Cerro del Veinte",
                ubicacion: "Irapuato, Guanajuato",
                lat: 20.6794496,
                lng: -101.4971843,
                descripcion: "Cerro emblemático ideal para caminatas de desafío y orientación. Excelente vista panorámica para la Tropa y el Clan.",
                actividades: ["DESAFÍO", "CAMINATA"]
            },

            {
                nombre: "Cráter El Rincón de Parangueo",
                ubicacion: "Valle de Santiago, Guanajuato",
                lat: 20.4312160,
                lng: -101.2497244,
                descripcion: "Impresionante cráter con un interior de paisaje blanco y salitroso. El cruce por su túnel oscuro es ideal para una gran experiencia de mística y aventura.",
                actividades: ["AVENTURA", "CRÁTER"]
            },

            {
                nombre: "Cañón de la Garita",
                ubicacion: "Pénjamo, Guanajuato",
                lat: 20.5488428,
                lng: -101.6641022,
                descripcion: "Impresionante cañón natural en la Sierra de Pénjamo, rodeado de imponentes paredes de roca y zonas con agua.",
                actividades: ["ARROYO", "EXPLORACIÓN"]
            },

            {
                nombre: "Cerro de La Bufa",
                ubicacion: "Guanajuato, Guanajuato",
                lat: 20.9944345,
                lng: -101.2530902,
                descripcion: "Emblemática formación rocosa con senderos de gran pendiente. Ideal para caminatas exigentes y prácticas de orientación.",
                actividades: ["RÁPEL", "SENDERISMO"]
            },

            {
                nombre: "Cerro del Muerto",
                ubicacion: "Aguascalientes",
                lat: 21.8700446,
                lng: -102.4258425,
                descripcion: "Imponente cresta montañosa ideal para caminatas de gran resistencia física.",
                actividades: ["RESISTENCIA", "HIKING"]
            },

            {
                nombre: "Cerro del Cubilete",
                ubicacion: "Silao, Guanajuato",
                lat: 21.0120474,
                lng: -101.3691937,
                descripcion: "Destino versátil con rutas rurales ideales para evaluar la resistencia en caminatas kilométricas.",
                actividades: ["ORIENTACIÓN", "CAMINATA"]
            },

            {
                nombre: "Sierra Fría",
                ubicacion: "Aguascalientes",
                lat: 22.1670082,
                lng: -102.5830887,
                descripcion: "Reserva forestal masiva de clima frío. Entorno ideal para campamentos de larga duración y exploración.",
                actividades: ["CAMPISMO", "EXPLORACIÓN"]
            },

            {
                nombre: "Parque Nacional El Cimatario",
                ubicacion: "Querétaro",
                lat: 20.5269562,
                lng: -100.3601507,
                descripcion: "Zona natural cercana a Querétaro ideal para caminatas y actividades al aire libre.",
                actividades: ["NATURALEZA", "CAMINATA"]
            },

            {
                nombre: "Bosque El Peral",
                ubicacion: "San José Iturbide, Guanajuato",
                lat: 20.9612718,
                lng: -100.2879392,
                descripcion: "Hermoso bosque alpino de coníferas. Ideal para campamentos de fin de semana y actividades scout.",
                actividades: ["BOSQUE", "FOGATAS"]
            },

            {
                nombre: "Parque La Beata",
                ubicacion: "Amealco, Querétaro",
                lat: 20.3130433,
                lng: -100.2381558,
                descripcion: "Zona boscosa templada con senderos rústicos bien delimitados.",
                actividades: ["SENDEROS", "PATRULLAS"]
            },

            {
                nombre: "Área Protegida Las Musas",
                ubicacion: "Manuel Doblado, Guanajuato",
                lat: 20.6359841,
                lng: -101.8912324,
                descripcion: "Paraje ribereño con ahuehuetes. Ideal para actividades scout al aire libre.",
                actividades: ["RÍO", "CABUYERÍA"]
            },

            {
                nombre: "Boca de Túnel",
                ubicacion: "San José de Gracia, Aguascalientes",
                lat: 22.2353936,
                lng: -102.4437842,
                descripcion: "Sistema de cañones y lagunas. Ideal para retos de altura, senderismo y aventura.",
                actividades: ["AVENTURA", "ROVERS"]
            },

            {
                nombre: "Peña de Bernal",
                ubicacion: "Bernal, Querétaro",
                lat: 20.7480920,
                lng: -99.9486163,
                descripcion: "Uno de los monolitos más grandes del mundo. Destino ideal para retos de resistencia.",
                actividades: ["MONTAÑA", "RETO"]
            },

            {
                nombre: "Mirador de Cuatro Palos",
                ubicacion: "Pinal de Amoles, Querétaro",
                lat: 21.0838869,
                lng: -99.6565660,
                descripcion: "Espectacular punto de transición entre el semidesierto y el bosque de niebla.",
                actividades: ["MÍSTICA", "ACAMPADO"]
            },

            {
                nombre: "Cerro El Quijay",
                ubicacion: "San José Iturbide, Guanajuato",
                lat: 21.2508486,
                lng: -100.5078710,
                descripcion: "Elevación agreste y semidesértica. Perfecta para exploración, mapas y orientación.",
                actividades: ["EXPLORACIÓN", "TOPOGRAFÍA"]
            },

            {
                nombre: "Reserva Sierra Gorda",
                ubicacion: "Querétaro",
                lat: 21.3034190,
                lng: -99.4561101,
                descripcion: "Inmensa reserva de la biosfera con múltiples microclimas. Excelente para expediciones de larga distancia.",
                actividades: ["EXPEDICIÓN", "SERVICIO"]
            }

        ];


        // =====================================================
        // GRUPO DE MARCADORES
        // =====================================================

        const grupoMarcadores = L.featureGroup();


        // Guardamos los marcadores individualmente
        const marcadores = [];


        // =====================================================
        // CREAR MARCADORES
        // =====================================================

        lugares.forEach((lugar, indice) => {

            const marcador = L.marker([
                lugar.lat,
                lugar.lng
            ]);


            // Crear etiquetas de actividades

            const etiquetas = lugar.actividades
                .map(actividad =>
                    `<span class="popup-tag">${actividad}</span>`
                )
                .join("");


            // Contenido del popup

            marcador.bindPopup(`

                <div>

                    <div class="popup-title">
                        📍 ${lugar.nombre}
                    </div>

                    <div class="popup-location">
                        <i class="fas fa-map-marker-alt"></i>
                        ${lugar.ubicacion}
                    </div>

                    <div class="popup-description">
                        ${lugar.descripcion}
                    </div>

                    <div class="popup-tags">
                        ${etiquetas}
                    </div>

                    <a
                        href="https://www.google.com/maps/search/?api=1&query=${lugar.lat},${lugar.lng}"
                        target="_blank"
                        class="popup-button">

                        <i class="fas fa-location-arrow"></i>
                        Ver en Google Maps

                    </a>

                </div>

            `);


            marcador.addTo(grupoMarcadores);

            marcadores.push(marcador);

        });


        // =====================================================
        // AGREGAR MARCADORES
        // =====================================================

        grupoMarcadores.addTo(map);


        // =====================================================
        // MOSTRAR TODOS LOS LUGARES
        // =====================================================

        function mostrarTodos() {

            map.fitBounds(
                grupoMarcadores.getBounds(),
                {
                    padding: [40, 40]
                }
            );

        }


        mostrarTodos();


        // =====================================================
        // BUSCADOR
        // =====================================================

        const searchInput = document.getElementById("mapSearch");
        const results = document.getElementById("results");
        const clearSearch = document.getElementById("clearSearch");


        searchInput.addEventListener("input", function() {

            const termino = this.value
                .toLowerCase()
                .trim();


            results.innerHTML = "";


            if (termino === "") {

                results.classList.add("hidden");
                clearSearch.style.display = "none";

                return;

            }


            clearSearch.style.display = "block";


            const encontrados = lugares.filter(lugar => {

                const texto = (

                    lugar.nombre +
                    " " +
                    lugar.ubicacion +
                    " " +
                    lugar.actividades.join(" ")

                ).toLowerCase();


                return texto.includes(termino);

            });


            if (encontrados.length === 0) {

                results.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search mr-1"></i>
                        No encontramos ese lugar.
                    </div>
                `;

                results.classList.remove("hidden");

                return;

            }


            encontrados.forEach(lugar => {

                const indice = lugares.indexOf(lugar);


                const item = document.createElement("div");

                item.className = "result-item";


                item.innerHTML = `

                    <div class="result-name">
                        📍 ${lugar.nombre}
                    </div>

                    <div class="result-location">
                        ${lugar.ubicacion}
                    </div>

                `;


                item.addEventListener("click", () => {

                    const marcador = marcadores[indice];


                    map.setView(
                        [lugar.lat, lugar.lng],
                        14
                    );


                    marcador.openPopup();


                    results.classList.add("hidden");

                });


                results.appendChild(item);

            });


            results.classList.remove("hidden");

        });


        // =====================================================
        // LIMPIAR BUSCADOR
        // =====================================================

        clearSearch.addEventListener("click", () => {

            searchInput.value = "";

            results.innerHTML = "";

            results.classList.add("hidden");

            clearSearch.style.display = "none";

            mostrarTodos();

            searchInput.focus();

        });


        // =====================================================
        // BOTÓN MOSTRAR TODOS
        // =====================================================

        document
            .getElementById("showAll")
            .addEventListener("click", () => {

                searchInput.value = "";

                results.innerHTML = "";

                results.classList.add("hidden");

                clearSearch.style.display = "none";

                mostrarTodos();

            });


        // =====================================================
        // CERRAR RESULTADOS AL TOCAR EL MAPA
        // =====================================================

        map.on("click", () => {

            results.classList.add("hidden");

        });

    </script>

</body>
</html>
